[project]
name = "firstread"
version = "0.1.0"
description = "Per-turn self-harm risk audit for mental health companion agents, powered by Jev."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
